name: Automatic Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v2.0.0'
        required: true
        type: string
  push:
    branches: [main]
    paths-ignore: ['docs/**']

permissions:
  contents: write
  packages: write

jobs:
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            latest=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n1)
            declared="v$(jq -r '.version' web/package.json)"
            if [ -z "$latest" ] || { [ "$declared" != "$latest" ] && [ "$(printf '%s\n' "$declared" "$latest" | sort -V | tail -n1)" = "$declared" ]; }; then
              version="$declared"
            else
              IFS='.' read -r major minor patch <<< "${latest#v}"
              if [ "$major" -lt 2 ]; then
                version="v2.0.0"
              else
                version="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  release:
    needs: tag
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.version }}
    secrets: inherit

  container:
    needs: tag
    uses: ./.github/workflows/docker-build-push.yml
    with:
      version: ${{ needs.tag.outputs.version }}
      ref: ${{ needs.tag.outputs.version }}
    secrets: inherit
