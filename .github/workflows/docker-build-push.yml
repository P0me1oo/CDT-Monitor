name: Container Images

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      ref:
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish multi-arch images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/cdt-monitor
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' && inputs.version == '' }}
            type=raw,value=latest,enable=${{ startsWith(inputs.version || github.ref_name, 'v') }}
            type=raw,value=${{ inputs.version || github.ref_name }},enable=${{ startsWith(inputs.version || github.ref_name, 'v') }}
            type=semver,pattern={{version}},value=${{ inputs.version || github.ref_name }},enable=${{ startsWith(inputs.version || github.ref_name, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version || github.ref_name }},enable=${{ startsWith(inputs.version || github.ref_name, 'v') }}
          labels: |
            org.opencontainers.image.title=CDT Monitor
            org.opencontainers.image.description=Aliyun CDT traffic monitoring and ECS automation console

      - name: Verify linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cdt-monitor:verify-amd64
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILT_AT=github-run-${{ github.run_id }}
          cache-from: type=gha

      - name: Check linux/amd64 binary architecture
        run: docker run --rm cdt-monitor:verify-amd64 version | grep -q 'linux/amd64)'

      - name: Verify linux/arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: cdt-monitor:verify-arm64
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILT_AT=github-run-${{ github.run_id }}
          cache-from: type=gha

      - name: Check linux/arm64 binary architecture
        run: docker run --rm cdt-monitor:verify-arm64 version | grep -q 'linux/arm64)'

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version || github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILT_AT=github-run-${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
